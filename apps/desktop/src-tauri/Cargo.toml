[package]
name = "builder"
version = "0.1.0"
description = "Local three-dimensional building editor"
authors = ["Building Editor contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
[dependencies]
tauri = { version = "=2.12.1", features = [] }
building-control-protocol = { path = "../../../rust/crates/control-protocol" }
tauri-plugin-dialog = "=2.8.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
percent-encoding = "=2.3.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
